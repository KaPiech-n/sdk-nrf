# Shared NCS BabbleSim OpenThread base for nrf52_bsim.
#
# Used by Zephyr BabbleSim tests and NCS OpenThread samples. Scenario-specific
# fragments (topology, coap, dataset) are chained after this file:
#
#   nrf52_bsim_openthread.conf;nrf52_bsim_<scenario>.conf
#
# See config/babblesim/README.rst and run_bsim_test.sh.

CONFIG_NRF_802154_SL_OPENSOURCE=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

CONFIG_OPENTHREAD_MANUAL_START=n

CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=n
CONFIG_OPENTHREAD_NORDIC_LIBRARY_FTD=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_1=y

CONFIG_OPENTHREAD_NETWORK_NAME="OTBSIM"
CONFIG_OPENTHREAD_PANID=4660
