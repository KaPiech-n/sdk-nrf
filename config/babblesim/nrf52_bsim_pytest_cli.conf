# BabbleSim OpenThread CLI for test-fw pytest (interactive shell over UART PTY).
# Build with serial-console snippet and nrf52_bsim_openthread.conf.
#
#   west build -b nrf52_bsim nrf/samples/openthread/cli -d build/ot-cli-bsim-pytest --sysbuild -- \
#     -DSNIPPET=serial-console \
#     -DEXTRA_CONF_FILE="<ncs>/nrf/config/babblesim/nrf52_bsim_openthread.conf;<ncs>/nrf/config/babblesim/nrf52_bsim_pytest_cli.conf" \
#     -DEXTRA_DTC_OVERLAY_FILE="<ncs>/nrf/config/babblesim/nrf52_bsim_pytest_cli.overlay"

CONFIG_OPENTHREAD_MANUAL_START=y

CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=4096
