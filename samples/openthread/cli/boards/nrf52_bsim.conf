# BabbleSim nrf52 has simulated flash (see nrf52_bsim.dts).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Nordic OpenThread defaults enable NVS; provide the settings backend.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# No flash-backed PSA ITS store on simulated target.
# SECURE_STORAGE uses settings-backed ITS on bsim (flash is enabled above).

# Use open-source 802.15.4 SL (no prebuilt native lib for bsim).
CONFIG_NRF_802154_SL_OPENSOURCE=y

# BabbleSim PoC: FTD + Thread 1.1 avoids CSL and other 1.4-only radio paths.
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=n
CONFIG_OPENTHREAD_NORDIC_LIBRARY_FTD=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_1=y

# Fixed test network for multi-node BabbleSim runs
CONFIG_OPENTHREAD_CHANNEL=26
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_NETWORK_NAME="OTBSIM"
CONFIG_OPENTHREAD_PANID=4660

# Auto-attach on boot (BabbleSim has no UART fifo shell injector in this PoC).
CONFIG_OPENTHREAD_MANUAL_START=n
